
<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>ערבית של אמיליה</title>
<style>
  :root{
    --bg:#fdf7f2; --card:#ffffff; --ink:#33303c; --muted:#8a8496;
    --pink:#ff7aa8; --pink-d:#e85f8e; --mint:#2fbf9b; --sky:#5aa9f7;
    --sun:#ffc75a; --bad:#ef5f6b; --line:#efe7e0;
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent}
  html,body{margin:0;padding:0;height:100%}
  body{
    background:var(--bg); color:var(--ink);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Rubik,Arial,sans-serif;
    display:flex; flex-direction:column; min-height:100%;
  }
  .wrap{flex:1; display:flex; flex-direction:column; max-width:520px; margin:0 auto; width:100%; padding:14px 16px 20px}
  .top{display:flex; align-items:center; justify-content:space-between; gap:8px; margin-bottom:6px}
  .hello{font-size:17px; font-weight:700}
  .hello span{color:var(--pink-d)}
  .ghost{
    background:#fff; border:1px solid var(--line); color:var(--muted);
    border-radius:999px; padding:7px 13px; font-size:13px; font-weight:600; cursor:pointer;
  }
  .stats{display:flex; gap:8px; margin:8px 0 4px}
  .chip{
    flex:1; background:var(--card); border:1px solid var(--line); border-radius:16px;
    padding:9px 6px; text-align:center;
  }
  .chip b{display:block; font-size:18px; line-height:1.2}
  .chip small{color:var(--muted); font-size:11px}
  .sync{text-align:center; color:var(--muted); font-size:11px; min-height:16px; margin:0 0 10px; font-weight:500}
  .qcard{
    background:var(--card); border:1px solid var(--line); border-radius:26px;
    padding:20px 16px; text-align:center; box-shadow:0 6px 18px rgba(80,60,70,.05);
  }
  .prompt{font-size:16px; font-weight:700; color:var(--ink); margin-bottom:12px; line-height:1.4}
  .stim{
    font-size:clamp(42px,14vw,64px); font-weight:700; line-height:1.35;
    margin:8px 0 6px; padding:10px 8px; border-radius:18px; background:#fffdfa;
    border:1px dashed var(--line); min-height:72px; display:flex; align-items:center; justify-content:center;
    font-family:"Segoe UI",Tahoma,"Noto Naskh Arabic","Amiri",Arial,sans-serif;
    direction:rtl; unicode-bidi:isolate;
  }
  .gloss{color:var(--muted); font-size:13px; font-weight:600; min-height:18px; margin-bottom:4px}
  .msg{min-height:28px; margin-top:10px; font-size:16px; font-weight:700}
  .msg.ok{color:var(--mint)} .msg.no{color:var(--bad)}
  .msg small{display:block; color:var(--muted); font-weight:600; font-size:13px; margin-top:2px}
  .opts{display:flex; flex-direction:column; gap:9px; margin-top:14px}
  .opt{
    background:var(--card); border:2px solid var(--line); border-radius:18px;
    padding:14px 12px; font-size:18px; font-weight:700; cursor:pointer; text-align:center;
    user-select:none;
  }
  .opt.ar{direction:rtl; unicode-bidi:isolate; font-size:26px;
    font-family:"Segoe UI",Tahoma,"Noto Naskh Arabic","Amiri",Arial,sans-serif}
  .opt:active{transform:translateY(1px); background:#f7f2ee}
  .opt.ok{border-color:var(--mint); background:#eefaf6; color:var(--mint)}
  .opt.no{border-color:var(--bad); background:#fdeef0; color:var(--bad)}
  .opt.dim{opacity:.55}
  .send{
    margin-top:14px; width:100%; padding:14px; border-radius:18px; border:none;
    background:var(--pink); color:#fff; font-size:16px; font-weight:700; cursor:pointer;
  }
  .send:active{background:var(--pink-d)}
  .send.mint{background:var(--mint)}
  .send.mint:active{background:#259f82}
  .copy{margin-top:8px; width:100%; padding:11px; border-radius:16px; border:1px solid var(--line); background:#fff; color:var(--muted); font-size:13px; font-weight:600; cursor:pointer}
  .hidden{display:none !important}
  h2{font-size:19px; margin:4px 0 12px}
  h3{font-size:15px; margin:18px 0 8px; color:var(--muted)}
  .panel{background:var(--card); border:1px solid var(--line); border-radius:20px; padding:14px}
  table{width:100%; border-collapse:collapse; font-size:13px}
  th,td{padding:7px 5px; text-align:right; border-bottom:1px solid var(--line)}
  th{color:var(--muted); font-weight:600; font-size:12px}
  .hard{display:flex; flex-wrap:wrap; gap:7px; margin-top:4px}
  .hard span{background:#fdeef0; color:#a3262f; border-radius:10px; padding:6px 10px; font-size:13px; font-weight:700; direction:rtl; unicode-bidi:isolate}
  .empty{color:var(--muted); font-size:14px; line-height:1.6; text-align:center; padding:12px 4px}
  .danger{margin-top:16px; width:100%; padding:12px; border-radius:16px; border:1px solid #ffd9e3; background:#fff; color:var(--bad); font-weight:700; font-size:14px; cursor:pointer}
  .pin{width:100%; padding:14px; font-size:22px; text-align:center; letter-spacing:8px; border-radius:16px; border:1px solid var(--line); direction:ltr}
  .note{color:var(--muted); font-size:12px; margin-top:8px; text-align:center}
  .badge{
    display:inline-block; background:#fff0cf; color:#8a6410; border-radius:999px;
    padding:4px 10px; font-size:12px; font-weight:700; margin-bottom:8px;
  }
  .weak-list{text-align:right; margin:8px 0; padding:0 4px}
  .weak-list li{margin:6px 0; font-size:14px; font-weight:600}
  .weak-list .ar{direction:rtl; unicode-bidi:isolate; font-size:18px; margin-left:6px}
  .home-card{background:var(--card); border:1px solid var(--line); border-radius:22px; padding:18px 16px; margin-top:8px}
  .sess-pick{display:flex; flex-direction:column; gap:8px; margin-top:10px; max-height:50vh; overflow:auto}
  .sess-btn{
    text-align:right; background:#fff; border:1px solid var(--line); border-radius:16px;
    padding:12px 14px; cursor:pointer; font-weight:700; font-size:14px;
  }
  .sess-btn:disabled{opacity:.45; cursor:not-allowed}
  .sess-btn small{display:block; color:var(--muted); font-weight:600; margin-top:2px}
  .progress-bar{height:8px; background:#efe7e0; border-radius:999px; overflow:hidden; margin:10px 0 4px}
  .progress-bar > i{display:block; height:100%; background:linear-gradient(90deg,var(--pink),var(--sun)); width:0%; border-radius:999px; transition:width .25s}
</style>
</head>
<body>
<div class="wrap">

  <div id="home">
    <div class="top">
      <div class="hello"><span>ערבית של אמיליה</span></div>
      <button class="ghost" id="btnParentHome" type="button">הורים</button>
    </div>
    <div class="sync" id="syncStatus"></div>
    <div class="home-card">
      <div class="badge">פְצחא · מנוקד · בלי שמע</div>
      <h2 style="margin-top:0">בואי נתרגל ערבית</h2>
      <p style="margin:0;color:var(--muted);font-size:14px;line-height:1.5" id="homeHint">סשן של 15 שאלות. אפשר לבחור סשן פתוח או להמשיך מהנוכחי.</p>
      <button class="send" id="btnStartCurrent" type="button" style="margin-top:16px">התחילי סשן <span id="curSessLabel">1</span></button>
      <button class="copy" id="btnPickSession" type="button">בחרי סשן אחר</button>
    </div>
    <div id="pickPanel" class="hidden" style="margin-top:12px">
      <h3>סשנים</h3>
      <div class="sess-pick" id="sessPick"></div>
    </div>
  </div>

  <div id="practice" class="hidden">
    <div class="top">
      <div class="hello">סשן <span id="sessNum">1</span></div>
      <button class="ghost" id="btnQuit" type="button">יציאה</button>
    </div>
    <div class="stats">
      <div class="chip"><b id="sProg">0/15</b><small>התקדמות</small></div>
      <div class="chip"><b id="sStreak">0</b><small>ברצף</small></div>
      <div class="chip"><b id="sAcc">—</b><small>הצלחה</small></div>
    </div>
    <div class="progress-bar"><i id="progFill"></i></div>
    <div class="sync" id="syncStatus2"></div>
    <div class="qcard">
      <div class="prompt" id="qPrompt">—</div>
      <div class="stim" id="qStim">—</div>
      <div class="gloss" id="qGloss"></div>
      <div class="msg" id="msg"></div>
    </div>
    <div class="opts" id="opts"></div>
  </div>

  <div id="summary" class="hidden">
    <div class="top">
      <div class="hello">סיכום סשן <span id="sumSess">1</span></div>
      <button class="ghost" id="btnSumHome" type="button">למסך הראשי</button>
    </div>
    <div class="panel">
      <h2 id="sumTitle">כל הכבוד!</h2>
      <table>
        <tr><th>נכון</th><td id="sumScore">—</td></tr>
        <tr><th>אחוז הצלחה</th><td id="sumAcc">—</td></tr>
        <tr><th>רצף מקסימלי</th><td id="sumBest">—</td></tr>
      </table>
      <h3>פריטים לחיזוק</h3>
      <ul class="weak-list" id="sumWeak"></ul>
      <button class="send" id="btnReport" type="button">שלחי דוח לאמא</button>
      <button class="copy" id="btnCopy" type="button">העתיקי את הדוח</button>
      <button class="send mint" id="btnNewSession" type="button">התחילי סשן חדש</button>
    </div>
  </div>

  <div id="pinScreen" class="hidden">
    <div class="top">
      <div class="hello">מסך הורים</div>
      <button class="ghost" id="btnPinBack" type="button">חזרה</button>
    </div>
    <div class="panel">
      <h2>הקלידו קוד</h2>
      <input class="pin" id="pinInput" type="tel" inputmode="numeric" maxlength="4" placeholder="••••" autocomplete="off">
      <div class="note" id="pinNote">ארבע ספרות</div>
    </div>
  </div>

  <div id="parent" class="hidden">
    <div class="top">
      <div class="hello">ההתקדמות של אמיליה</div>
      <button class="ghost" id="btnBack" type="button">חזרה</button>
    </div>
    <div class="sync" id="syncStatus3"></div>
    <div id="parentBody"></div>
    <button class="danger" id="btnReset" type="button">איפוס כל הנתונים</button>
  </div>

</div>

function cloudConfigured(){
  return !!(CLOUD.url && CLOUD.anonKey && CLOUD.url.indexOf("https://") === 0 && CLOUD.anonKey.length > 20);
}
function setSync(text){
  syncEls.forEach(function(el){ if(el) el.textContent = text || ""; });
}
function blank(){
  return { facts:{}, sessions:[], answers:0, unlockedSession:1, reviewBank:[], lastCurriculum:1 };
}
function load(){
  try{
    var raw = localStorage.getItem(KEY);
    return raw ? JSON.parse(raw) : blank();
  }catch(e){ return mem || (mem = blank()); }
}

  if(opts.immediate){

  }else{

function schedulePush(){
  if(pushTimer) clearTimeout(pushTimer);
  pushTimer = setTimeout(function(){ pushTimer = null; cloudPush(); }, 800);

function cloudHeaders(){
  return {
    "apikey": CLOUD.anonKey,
    "Authorization": "Bearer " + CLOUD.anonKey,
    "Content-Type": "application/json"
  };
}
function scoreData(d){
  if(!d || typeof d !== "object") return 0;
  var answers = typeof d.answers === "number" ? d.answers : 0;
  var sessions = d.sessions || [];
  var withQ = 0;
  for(var i = 0; i < sessions.length; i++){
    if(sessions[i] && sessions[i].q > 0) withQ++;
  }
  return answers * 1000 + withQ;
}
function normalizeDb(d){
  if(!d || typeof d !== "object") d = blank();
  if(!d.facts) d.facts = {};
  if(!d.sessions) d.sessions = [];
  if(typeof d.answers !== "number") d.answers = 0;
  if(typeof d.unlockedSession !== "number") d.unlockedSession = 1;
  if(!Array.isArray(d.reviewBank)) d.reviewBank = [];
  if(typeof d.lastCurriculum !== "number") d.lastCurriculum = 1;
  return d;
}
function cloudPull(){
  if(!cloudConfigured()){ setSync(""); return Promise.resolve(false); }
  setSync("שומר בענן…");
  var url = CLOUD.url + "/rest/v1/kefel_state?id=eq." + encodeURIComponent(CLOUD.rowId) + "&select=data,updated_at";

    return res.json();
  }).then(function(rows){
    var cloudData = null;
    if(rows && rows.length && rows[0] && rows[0].data){
      var data = rows[0].data;
      if(typeof data === "string"){ try{ data = JSON.parse(data); }catch(e){ data = null; } }
      if(data && typeof data === "object") cloudData = data;
    }

    var cloudScore = scoreData(cloudData);

      return cloudPush();

      setSync("מסונכרן");
      return false;
    }
  }).catch(function(){
    setSync("אין רשת — נשמר במכשיר");
    return false;
  });
}
function cloudPush(){
  if(!cloudConfigured()) return Promise.resolve(false);
  setSync("שומר בענן…");
  var url = CLOUD.url + "/rest/v1/kefel_state?on_conflict=id";
  var body = { id: CLOUD.rowId, data: db, updated_at: new Date().toISOString() };
  var headers = cloudHeaders();
  headers["Prefer"] = "resolution=merge-duplicates,return=minimal";
  return fetch(url, { method:"POST", headers:headers, body: JSON.stringify(body) }).then(function(res){
    if(!res.ok) throw new Error("push " + res.status);
    setSync("מסונכרן");
    return true;
  }).catch(function(){
    setSync("אין רשת — נשמר במכשיר");
    return false;
  });
}

}

function getBankSession(n){
  for(var i=0;i<BANK.sessions.length;i++){
    if(BANK.sessions[i].session === n) return BANK.sessions[i];
  }
  return null;
}
function curriculumTitle(n){
  for(var i=0;i<CURRICULUM.length;i++) if(CURRICULUM[i].n===n) return CURRICULUM[i].title;
  return "סשן " + n;
}
function sessionPlayable(n){
  return !!getBankSession(n);
}

function enqueueReview(q){
  var id = q.id;
  var exists = false;
  for(var i=0;i<db.reviewBank.length;i++){
    if(db.reviewBank[i].id === id){ exists = true; break; }
  }
  if(!exists){
    db.reviewBank.push({
      id: q.id, type: q.type, prompt_he: q.prompt_he, stimulus_ar: q.stimulus_ar,
      answer: q.answer, options: (q.options || []).slice(), gloss_he: q.gloss_he || "",
      skills: (q.skills || []).slice(), fromSession: play.curriculum
    });
  }
}
function takeReviews(max){
  var out = [];
  while(out.length < max && db.reviewBank.length){
    out.push(db.reviewBank.shift());
  }
  return out;
}

function shuffle(arr){
  var a = arr.slice();
  for(var i=a.length-1;i>0;i--){
    var j = Math.floor(Math.random()*(i+1));
    var t=a[i]; a[i]=a[j]; a[j]=t;
  }
  return a;
}
function looksArabic(s){
  return /[\u0600-\u06FF]/.test(String(s||""));
}
function buildQueue(curriculumNum){
  var bs = getBankSession(curriculumNum);
  if(!bs) return [];
  var base = bs.questions.slice();
  var reviews = takeReviews(4);
  var queue = [];
  var used = {};
  reviews.forEach(function(r){
    queue.push(r);
    used[r.id] = true;
  });
  for(var i=0;i<base.length && queue.length < SESSION_SIZE; i++){
    if(used[base[i].id]) continue;
    if(reviews.length){
      var sk = base[i].skills || [];
      if(base[i].type === "review" || base[i].type === "interleave" || sk.indexOf("review")>=0){
        if(queue.length + (base.length - i) > SESSION_SIZE) continue;
      }
    }
    queue.push(base[i]);
    used[base[i].id] = true;
  }
  for(var j=0;j<base.length && queue.length < SESSION_SIZE; j++){
    if(used[base[j].id]) continue;
    queue.push(base[j]);
    used[base[j].id] = true;
  }
  return queue.slice(0, SESSION_SIZE);
}

var play = {
  curriculum: 1, queue: [], idx: 0, correct: 0, best: 0, streak: 0,
  weak: [], locked: false, sessionRec: null, started: 0
};
var PRAISE = ["מדויק!","נכון מאוד!","כל הכבוד!","יפה!","בדיוק!","אלופה!"];

function startSession(curriculumNum){
  if(!sessionPlayable(curriculumNum)){
    window.alert("סשן " + curriculumNum + " עדיין לא זמין — בקרוב נוסיף תוכן.");
    return;
  }
  if(curriculumNum > db.unlockedSession){
    window.alert("סשן זה עדיין נעול. סיימי קודם את הסשנים הקודמים.");
    return;
  }
  play.curriculum = curriculumNum;
  play.queue = buildQueue(curriculumNum);
  play.idx = 0;
  play.correct = 0;
  play.best = 0;
  play.streak = 0;
  play.weak = [];
  play.locked = false;
  play.started = Date.now();
  play.sessionRec = {
    start: play.started, last: play.started, ms: 0,
    q: 0, correct: 0, best: 0,
    curriculum: curriculumNum,
    title: curriculumTitle(curriculumNum),
    weak: []
  };
  db.sessions.push(play.sessionRec);
  db.lastCurriculum = curriculumNum;
  save();
  document.getElementById("sessNum").textContent = String(curriculumNum);
  show("practice");
  renderQuestion();
}

function touchSession(){
  var now = Date.now(), s = play.sessionRec;
  if(!s) return;
  var dt = now - s.last;
  if(dt > 0 && dt < 60000) s.ms += dt;
  s.last = now;
}

function currentQ(){ return play.queue[play.idx]; }

function renderQuestion(){
  var q = currentQ();
  if(!q){ finishSession(); return; }
  play.locked = false;
  document.getElementById("sProg").textContent = (play.idx + 1) + "/" + SESSION_SIZE;
  document.getElementById("progFill").style.width = Math.round(100 * play.idx / SESSION_SIZE) + "%";
  document.getElementById("sStreak").textContent = String(play.streak);
  document.getElementById("sAcc").textContent = play.sessionRec.q ? Math.round(100*play.sessionRec.correct/play.sessionRec.q)+"%" : "—";
  document.getElementById("qPrompt").textContent = q.prompt_he || "";
  var stim = document.getElementById("qStim");
  if(q.type === "translate_he_ar"){
    stim.textContent = "؟";
  } else {
    stim.textContent = q.stimulus_ar || "";
  }
  var gloss = document.getElementById("qGloss");
  if(q.type === "translate_ar_he" || q.type === "translate_he_ar"){
    gloss.textContent = "";
  } else {
    gloss.textContent = q.gloss_he ? ("עזרה: " + q.gloss_he) : "";
  }
  document.getElementById("msg").textContent = "";
  document.getElementById("msg").className = "msg";

  var opts = document.getElementById("opts");
  opts.innerHTML = "";
  var choices = shuffle(q.options || []);
  choices.forEach(function(opt){
    var b = document.createElement("button");
    b.type = "button";
    b.className = "opt" + (looksArabic(opt) ? " ar" : "");
    b.textContent = opt;
    b.addEventListener("click", function(){ chooseAnswer(opt, b); });
    opts.appendChild(b);
  });
}

function chooseAnswer(opt, btn){
  if(play.locked) return;
  play.locked = true;
  var q = currentQ();
  touchSession();
  var f = fact(q.id);
  f.label = (q.stimulus_ar || "") + " · " + (q.answer || "");
  f.stim = q.stimulus_ar || "";
  f.seen++;
  play.sessionRec.q++;
  db.answers++;

  var ok = String(opt) === String(q.answer);
  var buttons = document.querySelectorAll("#opts .opt");
  buttons.forEach(function(el){
    el.classList.add("dim");
    if(String(el.textContent) === String(q.answer)) el.classList.add("ok");
  });
  if(btn){
    btn.classList.remove("dim");
    btn.classList.add(ok ? "ok" : "no");
  }

  var msg = document.getElementById("msg");
  if(ok){
    f.correct++; f.streak++;
    play.correct++; play.streak++;
    play.sessionRec.correct++;
    if(play.streak > play.best) play.best = play.streak;
    if(play.best > play.sessionRec.best) play.sessionRec.best = play.best;
    msg.className = "msg ok";
    msg.textContent = PRAISE[Math.floor(Math.random()*PRAISE.length)];
    if(q.gloss_he) msg.innerHTML += "<small>" + escapeHtml(q.gloss_he) + "</small>";
  } else {
    f.wrong++; f.streak = 0; f.lastWrongAt = db.answers;
    play.streak = 0;
    play.weak.push({ id:q.id, stim:q.stimulus_ar, answer:q.answer, prompt:q.prompt_he, gloss:q.gloss_he||"" });
    play.sessionRec.weak = play.weak.slice();
    enqueueReview(q);
    msg.className = "msg no";
    var dir = looksArabic(q.answer) ? "rtl" : "rtl";
    msg.innerHTML = "כמעט! התשובה: <span style=\"unicode-bidi:isolate;direction:" + dir + "\">" +
      escapeHtml(q.answer) + "</span>" +
      (q.gloss_he ? "<small>" + escapeHtml(q.gloss_he) + "</small>" : "<small>נחזור לזה בעוד מעט</small>");
  }

  document.getElementById("sProg").textContent = (play.idx + 1) + "/" + SESSION_SIZE;
  document.getElementById("progFill").style.width = Math.round(100 * (play.idx + 1) / SESSION_SIZE) + "%";
  document.getElementById("sStreak").textContent = String(play.streak);
  document.getElementById("sAcc").textContent = Math.round(100*play.sessionRec.correct/play.sessionRec.q) + "%";

  save({immediate:true});

  var delay = ok ? 750 : 1400;
  setTimeout(function(){
    play.idx++;
    if(play.idx >= SESSION_SIZE || play.idx >= play.queue.length){
      finishSession();
    } else {
      renderQuestion();
    }
  }, delay);
}

function escapeHtml(s){
  return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;");
}

function finishSession(){
  var acc = play.sessionRec.q ? play.sessionRec.correct / play.sessionRec.q : 0;
  if(play.sessionRec.q >= SESSION_SIZE){
    db.unlockedSession = Math.min(20, Math.max(db.unlockedSession, play.curriculum + 1));
  }
  save({immediate:true});

  document.getElementById("sumSess").textContent = String(play.curriculum);
  document.getElementById("sumTitle").textContent = acc >= 0.8 ? "אלופה! 🌟" : (acc >= 0.6 ? "כל הכבוד!" : "יפה שהתאמנת — נחזק ביחד");
  document.getElementById("sumScore").textContent = play.sessionRec.correct + " מתוך " + play.sessionRec.q;
  document.getElementById("sumAcc").textContent = Math.round(100*acc) + "%";
  document.getElementById("sumBest").textContent = String(play.sessionRec.best);

  var ul = document.getElementById("sumWeak");
  ul.innerHTML = "";
  if(!play.weak.length){
    ul.innerHTML = "<li style=\"color:var(--mint)\">בלי טעויות בסשן הזה 🎉</li>";
  } else {
    play.weak.forEach(function(w){
      var li = document.createElement("li");
      li.innerHTML = "<span class=\"ar\">" + escapeHtml(w.stim || "") + "</span> → " + escapeHtml(w.answer || "") +
        (w.gloss ? " <span style=\"color:var(--muted)\">(" + escapeHtml(w.gloss) + ")</span>" : "");
      ul.appendChild(li);
    });
  }
  show("summary");
}

function reportText(){
  var s = play.sessionRec;
  if(!s || !s.q) return null;
  var lines = [];
  lines.push("דוח תרגול ערבית — אמיליה");
  lines.push("סשן " + s.curriculum + ": " + (s.title || curriculumTitle(s.curriculum)));
  lines.push(fmtDate(s.start) + " בשעה " + fmtTime(s.start));
  lines.push("זמן תרגול: " + fmtDur(s.ms));
  lines.push("שאלות: " + s.q);
  lines.push("נכון: " + s.correct + " (" + Math.round(100*s.correct/s.q) + "%)");
  lines.push("רצף מקסימלי: " + s.best);
  if(s.weak && s.weak.length){
    lines.push("");
    lines.push("לחיזוק:");
    s.weak.forEach(function(w){
      lines.push("• " + (w.stim||"") + " → " + (w.answer||""));
    });
  } else {
    lines.push("");
    lines.push("בלי טעויות בכלל 🎉");
  }
  return lines.join("\n");
}

function pad2(n){ return (n<10?"0":"") + n; }
function fmtDate(ts){ var d = new Date(ts); return pad2(d.getDate())+"/"+pad2(d.getMonth()+1)+"/"+d.getFullYear(); }
function fmtTime(ts){
  var d = new Date(ts);
  try{
    return new Intl.DateTimeFormat("he-IL", { timeZone:"Asia/Jerusalem", hour:"2-digit", minute:"2-digit", hour12:false }).format(d);
  }catch(e){
    return pad2(d.getHours())+":"+pad2(d.getMinutes());
  }
}
function fmtDur(ms){
  var m = Math.round(ms/60000);
  if(m < 1) return "פחות מדקה";
  if(m < 60) return m + " דק׳";
  return Math.floor(m/60) + " שע׳ " + (m%60) + " דק׳";
}
function hardest(n){
  var arr = [];
  for(var k in db.facts){
    var f = db.facts[k];
    if(f.wrong > 0) arr.push({k:k, wrong:f.wrong, seen:f.seen, correct:f.correct, label:f.label||k, stim:f.stim||""});
  }
  arr.sort(function(x,y){
    if(y.wrong !== x.wrong) return y.wrong - x.wrong;
    return (x.correct/(x.seen||1)) - (y.correct/(y.seen||1));
  });
  return arr.slice(0,n);
}

var scr = {
  home: document.getElementById("home"),
  practice: document.getElementById("practice"),
  summary: document.getElementById("summary"),
  pin: document.getElementById("pinScreen"),
  parent: document.getElementById("parent")
};
function show(name){
  for(var k in scr) scr[k].classList.add("hidden");
  scr[name].classList.remove("hidden");
  if(name === "home") refreshHome();
}

function refreshHome(){
  document.getElementById("curSessLabel").textContent = String(db.unlockedSession);
  document.getElementById("homeHint").textContent =
    "סשן פתוח: " + db.unlockedSession + " — " + curriculumTitle(db.unlockedSession) +
    (sessionPlayable(db.unlockedSession) ? "" : " (תוכן מלא לסשנים 1–10; אחר כך נוסיף)");
  var pick = document.getElementById("sessPick");
  pick.innerHTML = "";
  CURRICULUM.forEach(function(c){
    var btn = document.createElement("button");
    btn.type = "button";
    btn.className = "sess-btn";
    var locked = c.n > db.unlockedSession;
    var playable = sessionPlayable(c.n);
    btn.disabled = locked || !playable;
    btn.innerHTML = "סשן " + c.n + ": " + escapeHtml(c.title) +
      "<small>" + (locked ? "🔒 נעול" : (playable ? "פתוח · 15 שאלות" : "מבנה מוכן — תוכן בקרוב")) + "</small>";
    if(!locked && playable){
      btn.addEventListener("click", function(){
        document.getElementById("pickPanel").classList.add("hidden");
        startSession(c.n);
      });
    }
    pick.appendChild(btn);
  });
}

document.getElementById("btnStartCurrent").addEventListener("click", function(){
  var n = db.unlockedSession || 1;
  if(!sessionPlayable(n)){
    for(var i=Math.min(n,10); i>=1; i--){
      if(sessionPlayable(i)){ n=i; break; }
    }
  }
  startSession(n);
});
document.getElementById("btnPickSession").addEventListener("click", function(){
  document.getElementById("pickPanel").classList.toggle("hidden");
  refreshHome();
});
document.getElementById("btnQuit").addEventListener("click", function(){
  if(play.sessionRec && play.sessionRec.q > 0){
    if(!window.confirm("לצאת באמצע הסשן? ההתקדמות עד כה תישמר.")) return;
    save({immediate:true});
  } else if(play.sessionRec && play.sessionRec.q === 0){
    var ix = db.sessions.indexOf(play.sessionRec);
    if(ix>=0) db.sessions.splice(ix,1);
    save();
  }
  show("home");
});
document.getElementById("btnSumHome").addEventListener("click", function(){ show("home"); });
document.getElementById("btnNewSession").addEventListener("click", function(){
  var next = db.unlockedSession || play.curriculum || 1;
  if(!sessionPlayable(next)) next = play.curriculum;
  startSession(next);
});
document.getElementById("btnReport").addEventListener("click", function(){
  var t = reportText();
  if(!t){ window.alert("אין דוח עדיין"); return; }
  window.open("https://wa.me/?text=" + encodeURIComponent(t), "_blank");
});
document.getElementById("btnCopy").addEventListener("click", function(){
  var t = reportText();
  if(!t){ window.alert("אין דוח עדיין"); return; }
  if(navigator.clipboard && navigator.clipboard.writeText){
    navigator.clipboard.writeText(t).then(function(){ window.alert("הדוח הועתק"); }, function(){ window.prompt("העתיקי:", t); });
  } else window.prompt("העתיקי:", t);
});

function openPin(){
  document.getElementById("pinInput").value = "";
  document.getElementById("pinNote").textContent = "ארבע ספרות";
  show("pin");
  setTimeout(function(){ document.getElementById("pinInput").focus(); }, 60);
}
document.getElementById("btnParentHome").addEventListener("click", openPin);
document.getElementById("btnPinBack").addEventListener("click", function(){ show("home"); });
document.getElementById("pinInput").addEventListener("input", function(e){
  var v = e.target.value.replace(/\D/g,"").slice(0,4);
  e.target.value = v;
  if(v.length === 4){
    if(v === PIN){
      cloudPull().then(function(){
        buildParent();
        show("parent");
        save({immediate:true});
      });
    } else {
      document.getElementById("pinNote").textContent = "קוד לא נכון";
      e.target.value = "";
    }
  }
});
document.getElementById("btnBack").addEventListener("click", function(){ show("home"); });
document.getElementById("btnReset").addEventListener("click", function(){
  if(window.confirm("לאפס את כל נתוני הערבית של אמיליה? אין דרך לשחזר.")){
    db = blank();
    save({immediate:true});
    buildParent();
  }
});

function buildParent(){
  var host = document.getElementById("parentBody");
  var real = db.sessions.filter(function(s){ return s.q > 0; });
  var syncNote = cloudConfigured() ? "סנכרון ענן פעיל (emilia-arabic)" : "ענן לא מוגדר";
  if(!real.length){
    host.innerHTML = '<div class="panel"><div class="empty">עדיין אין סשנים.<br>אחרי שאמיליה תתרגל, יופיעו כאן הרשימה, הדיוק והפריטים הקשים.<br><br>' + syncNote + '</div></div>';
    return;
  }
  var tq=0, tc=0, tms=0;
  real.forEach(function(s){ tq+=s.q; tc+=s.correct; tms+=s.ms; });
  var h = '<div class="panel"><h2>סך הכול</h2><table>';
  h += '<tr><th>סשנים</th><td>' + real.length + '</td></tr>';
  h += '<tr><th>שאלות</th><td>' + tq + '</td></tr>';
  h += '<tr><th>אחוז הצלחה</th><td>' + Math.round(100*tc/tq) + '%</td></tr>';
  h += '<tr><th>זמן מצטבר</th><td>' + fmtDur(tms) + '</td></tr>';
  h += '<tr><th>סשן פתוח</th><td>' + db.unlockedSession + ' — ' + escapeHtml(curriculumTitle(db.unlockedSession)) + '</td></tr>';
  h += '<tr><th>בנק חזרה</th><td>' + (db.reviewBank||[]).length + ' פריטים</td></tr>';
  h += '<tr><th>סנכרון</th><td>' + syncNote + '</td></tr>';
  h += '</table></div>';

  h += '<h3>רשימת סשנים</h3><div class="panel"><table>';
  h += '<tr><th>תאריך</th><th>סשן</th><th>זמן</th><th>נכון</th><th>הצלחה</th></tr>';
  real.slice().reverse().slice(0,30).forEach(function(s){
    h += '<tr><td>' + fmtDate(s.start) + '</td><td>' + (s.curriculum||"?") +
         '</td><td>' + fmtDur(s.ms) + '</td><td>' + s.correct + '/' + s.q +
         '</td><td>' + Math.round(100*s.correct/s.q) + '%</td></tr>';
  });
  h += '</table></div>';

  var hard = hardest(10);
  h += '<h3>הפריטים הקשים ביותר</h3><div class="panel">';
  if(hard.length){
    h += '<div class="hard">';
    hard.forEach(function(x){
      h += '<span>' + escapeHtml(x.stim || x.label) + ' · ' + x.wrong + ' טעויות</span>';
    });
    h += '</div>';
  } else {
    h += '<div class="empty">אין פריטים עם טעויות — הכול נכון עד כה.</div>';
  }
  h += '</div>';
  host.innerHTML = h;
}

syncEls = [
  document.getElementById("syncStatus"),
  document.getElementById("syncStatus2"),
  document.getElementById("syncStatus3")
];
cloudPull().then(function(){
  refreshHome();
  show("home");
});
